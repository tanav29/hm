<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Document</title>
</head>
<body>
  <main class="max-w-md mx-auto p-8">
    <div class="rounded-xl bg-slate-100 p-6">
      <h1 class="text-2xl font-bold">Stay in touch</h1>
      <p class="mt-2">A little inspiration, delivered occasionally.</p>
      <form class="mt-4 space-y-3" action="/subscribe" method="post">
        <label class="block" for="email">Email address</label>
        <input id="email" class="w-full rounded border p-2" type="email" name="email" required="">
        <button class="rounded bg-slate-900 px-4 py-2 text-white" type="submit">Subscribe</button>
      </form>
    </div>
  </main>
</body>
</html>
