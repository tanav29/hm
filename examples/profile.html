<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Alex Morgan</title>
</head>
<body>
  <main class="min-h-screen bg-[#eef2ff] flex items-center justify-center p-6">
    <article class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
      <img class="w-20 h-20 rounded-full" src="https://i.pravatar.cc/160?img=12" alt="Portrait of Alex Morgan">
      <h1 class="mt-5 text-2xl font-bold text-slate-900">Alex Morgan</h1>
      <p class="mt-1 text-indigo-600 font-medium">Product designer</p>
      <p class="mt-4 text-slate-600">I turn complex ideas into simple, useful experiences.</p>
      <div class="mt-6 flex gap-3">
        <a class="rounded-lg bg-indigo-600 text-white px-4 py-2 hover:bg-indigo-700" href="mailto:alex@example.com">Get in touch</a>
        <a class="rounded-lg border border-slate-300 px-4 py-2 hover:bg-slate-50" href="https://example.com">Portfolio</a>
      </div>
    </article>
  </main>
</body>
</html>
